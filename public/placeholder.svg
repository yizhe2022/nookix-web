<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900" fill="none">
  <rect width="600" height="900" fill="#EAEAEA" rx="8"/>
  <!-- Book icon - enlarged -->
  <g transform="translate(150, 260)" opacity="0.45">
    <!-- Back page -->
    <rect x="20" y="0" width="260" height="340" rx="10" fill="#fff" stroke="#C9C9C9" stroke-width="3"/>
    <!-- Front page -->
    <rect x="0" y="10" width="260" height="340" rx="10" fill="#fff" stroke="#C9C9C9" stroke-width="3"/>
    <!-- Spine -->
    <line x1="32" y1="10" x2="32" y2="350" stroke="#C9C9C9" stroke-width="2.5"/>
    <!-- Title lines -->
    <rect x="60" y="90" width="150" height="10" rx="5" fill="#C9C9C9"/>
    <rect x="60" y="115" width="110" height="10" rx="5" fill="#C9C9C9"/>
    <!-- Author line -->
    <rect x="60" y="155" width="80" height="7" rx="3.5" fill="#D5D5D5"/>
  </g>
  <!-- "Book Cover" text - enlarged -->
  <text x="300" y="670" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="36" fill="#B0B0B0" font-weight="400">Book Cover</text>
</svg>